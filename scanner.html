<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">ระบบสแกนเข้า-ออกพื้นที่</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');

/* Hybrid Dark Airport Theme */
:root {
--color-dark-bg: #0F1115;
--color-dark-card: #181B21;
--color-dark-border: #2A2D34;
--color-primary: #50FF6B;
--color-secondary: #4DA3FF;
--color-warning: #FFC857;
--color-error: #FF3D51;
--text-light: #E6E9EF;
}

.dark {
color-scheme: dark;
font-family: 'Inter', sans-serif;
background: linear-gradient(180deg, #0D0F12 0%, #121418 100%);
color: var(--text-light);
}

.dark .bg-dark-bg { background-color: var(--color-dark-bg); }
.dark .bg-dark-card { background-color: var(--color-dark-card); }
.dark .border-dark-border { border-color: var(--color-dark-border); }

.dark .text-primary { color: var(--color-primary); }
.dark .text-secondary { color: var(--color-secondary); }
.dark .text-warning { color: var(--color-warning); }
.dark .text-error { color: var(--color-error); }

.dark .bg-primary { background-color: var(--color-primary); }
.dark .bg-secondary { background-color: var(--color-secondary); }
.dark .bg-warning { background-color: var(--color-warning); }
.dark .bg-error { background-color: var(--color-error); }

/* Input Fields */
.dark input, .dark select, .dark textarea {
background-color: #1E2127;
border: 1px solid var(--color-dark-border);
color: var(--text-light);
transition: 0.2s ease;
}

.dark input:focus, .dark select:focus, .dark textarea:focus {
border-color: var(--color-primary);
box-shadow: 0 0 8px rgba(80, 255, 107, 0.4);
}

.dark button.bg-primary { background-color: var(--color-primary); color: #000; font-weight: 700; box-shadow: 0 0 12px rgba(80, 255, 107, 0.4); transition: 0.25s; }
.dark button.bg-warning { background-color: var(--color-warning); color: #000; font-weight: 700; box-shadow: 0 0 12px rgba(255, 200, 87, 0.4); transition: 0.25s; }
.dark .border-primary { border-color: var(--color-primary); }
.dark .border-secondary { border-color: var(--color-secondary); }
.dark .border-warning { border-color: var(--color-warning); }
.dark button.bg-primary:hover { background-color: #40cc56; transform: translateY(-2px); box-shadow: 0 4px 16px rgba(80, 255, 107, 0.6); }
</style>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="p-4 sm:p-8 dark:bg-dark-bg text-gray-200 min-h-screen">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-center text-primary mb-2">SAKON NAKHON AIRPORT</h1>
        <h2 id="modeTitle" class="text-2xl font-semibold text-center text-white mb-8">จุดสแกน: กำลังโหลด...</h2>

        <div id="reader-container" class="bg-dark-card p-6 rounded-xl shadow-2xl border border-dark-border mb-6">
            <div id="reader" class="hidden"></div>
            <div id="message" class="mt-4 p-3 rounded text-center text-sm font-medium hidden"></div>
            
            <div class="flex justify-center mt-4 space-x-4">
                <button id="startScanBtn" onclick="startScanning()" class="px-6 py-3 bg-primary text-white rounded-lg shadow-md hover:bg-green-600 flex items-center">
                    <span class="text-black">เปิดกล้องสแกน</span>
                </button>
                <button id="stopScanBtn" onclick="stopScanning()" class="px-6 py-3 bg-red-600 text-white rounded-lg shadow-md hover:bg-red-700 flex items-center hidden">
                    ปิดกล้อง
                </button>
                <button id="toggleCameraBtn" onclick="toggleCamera()" class="px-6 py-3 bg-secondary text-white rounded-lg shadow-md hover:bg-blue-600 flex items-center hidden">
                    สลับกล้อง
                </button>
            </div>

            <div class="mt-6 pt-4 border-t border-dark-border">
                <p class="text-sm text-gray-400 mb-2 text-center">พิมพ์รหัสด้วยตนเอง หรือยิงจากเครื่องอ่านบาร์โค้ด</p>
                <div class="flex justify-center max-w-md mx-auto space-x-2">
                    <input type="text" id="barcodeInput" class="flex-1 bg-dark-bg border border-dark-border rounded-lg px-4 py-2 text-white text-lg tracking-wider" placeholder="คลิกที่นี่ แล้วยิงบาร์โค้ด..." autocomplete="off" onkeypress="handleBarcodeInput(event)" autofocus>
                    <button onclick="submitBarcode()" class="px-4 py-2 bg-secondary text-white rounded-lg hover:bg-blue-600 font-semibold">ตกลง</button>
                </div>
            </div>
        </div>
    </div>
    
    <div id="resultModal" class="fixed inset-0 bg-black bg-opacity-70 z-50 hidden flex flex-col items-center justify-start min-h-screen p-4 overflow-y-auto">
        <div id="modalContent" class="bg-dark-card p-6 rounded-xl shadow-2xl w-full max-w-lg mx-auto transform transition-all mt-10">
            <div id="userInfoDisplay" class="text-center mb-6">
                <h3 class="text-2xl font-bold text-primary mb-1" id="modalStatusTitle"></h3>
                <img id="modalProfileImg" src="" onerror="this.src='https://placehold.co/150x150/333/fff?text=No+Img'" class="w-32 h-32 rounded-full object-cover border-4 border-primary mx-auto my-3">
                <p class="text-xl font-semibold text-white" id="modalFullName"></p>
                <p class="text-gray-400" id="modalRegId"></p>
                <p class="text-base text-gray-300 mt-2" id="modalDepartment"></p>
                <p class="text-base text-gray-300" id="modalPosition"></p>
                <div id="modalAreaContainer" class="mt-3 p-2 mx-auto inline-block border-2 rounded-lg bg-dark-bg border-warning">
                    <p class="text-2xl font-extrabold text-warning" id="modalAviationArea"></p>
                </div>
                <p class="text-lg font-medium text-primary mt-2" id="modalCardType"></p>
                <p class="text-sm text-yellow-400" id="modalExpiry"></p>
                <p id="modalMessage" class="text-lg mt-3 font-medium text-white"></p>
            </div>

            <div id="entryDetailsSection" class="p-4 bg-gray-700 rounded-lg mb-6 hidden">
                <p id="entryDetailsTitle" class="font-semibold text-lg mb-3 border-b border-dark-border pb-2 text-white">รายละเอียดการเข้าพื้นที่:</p>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <p class="text-sm text-gray-300 mb-2 font-medium">สิ่งของนำเข้า:</p>
                        <div class="flex flex-col space-y-2">
                            <label class="inline-flex items-center text-white"><input type="checkbox" id="checkRadio" class="form-checkbox h-5 w-5 text-primary rounded bg-gray-800"><span class="ml-2">วิทยุ</span></label>
                            <label class="inline-flex items-center text-white"><input type="checkbox" id="checkMobile" class="form-checkbox h-5 w-5 text-primary rounded bg-gray-800"><span class="ml-2">มือถือ</span></label>
                            <label class="inline-flex items-center text-white"><input type="checkbox" id="checkEquipment" class="form-checkbox h-5 w-5 text-primary rounded bg-gray-800"><span class="ml-2">อุปกรณ์/เครื่องมือ</span></label>
                        </div>
                    </div>
                    <div>
                         <p class="text-sm text-gray-300 mb-2 font-medium">วัตถุประสงค์:</p>
                         <select id="objectiveSelect" class="w-full p-2 bg-dark-bg border border-dark-border rounded text-white"><option value="ปฏิบัติงาน">ปฏิบัติงาน</option><option value="ตรวจสอบ">ตรวจสอบ</option><option value="เยี่ยมชม">เยี่ยมชม</option></select>
                    </div>
                </div>
            </div>
            
            <div id="escortSection" class="hidden text-center p-4 bg-red-800 bg-opacity-30 rounded-lg mb-6 border border-red-500">
                <p class="font-bold text-red-400 mb-3">สแกนบัตร "ถาวร" เพื่อรับรอง (Escort)</p>
                <div id="escort-reader-container" class="mb-4"><div id="escort-reader"></div></div>
                <div class="mt-2 mb-4">
                    <p class="text-xs text-gray-400 mb-1">หรือกรอกรหัส / ยิงบาร์โค้ด</p>
                    <div class="flex justify-center space-x-2">
                         <input type="text" id="escortBarcodeInput" class="w-full bg-dark-bg border border-dark-border rounded-lg px-3 py-2 text-white placeholder-gray-500 text-sm" placeholder="รหัสผู้รับรอง..." onkeypress="handleEscortBarcodeInput(event)">
                        <button onclick="submitEscortBarcode()" class="px-3 py-2 bg-secondary text-white rounded-lg font-semibold text-sm">ตกลง</button>
                    </div>
                </div>
                <div id="escortStatus" class="p-2 text-sm rounded mt-2 text-white"></div>
            </div>
            
            <div class="flex justify-between space-x-4">
                <button id="cancelButton" onclick="cancelTransaction()" class="flex-1 px-4 py-3 bg-red-600 text-white rounded-lg shadow-md hover:bg-red-700 font-semibold">ยกเลิก <br>(ไม่บันทึก)</button>
                <button id="escortScanButton" onclick="startEscortScan()" class="flex-1 px-4 py-3 bg-secondary text-white rounded-lg shadow-md hover:bg-blue-600 font-semibold hidden">เปิดกล้องสแกน Escort</button>
                <button id="confirmButton" onclick="confirmTransaction()" class="flex-1 px-4 py-3 bg-primary text-white rounded-lg shadow-md hover:bg-green-600 font-semibold hidden">ยืนยัน <br>(บันทึก)</button>
            </div>
        </div>
    </div>
    
    <div id="loadingModal" class="fixed inset-0 bg-black bg-opacity-70 z-50 hidden flex items-center justify-center">
        <div class="flex flex-col items-center bg-dark-card p-6 rounded-lg">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-primary mb-4"></div>
            <p class="text-primary text-xl font-bold animate-pulse">กำลังบันทึกข้อมูล...</p>
        </div>
    </div>

    <div id="finalResultModal" class="fixed inset-0 bg-black bg-opacity-70 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-dark-card p-8 rounded-xl shadow-2xl w-full max-w-sm mx-auto transform transition-all text-center">
            <div id="finalResultIcon" class="mb-4"></div>
             <img id="finalResultImg" src="" class="w-24 h-24 rounded-full object-cover border-4 border-gray-600 mx-auto mb-4 hidden">
            <h3 id="finalResultTitle" class="text-3xl font-bold mb-2 text-primary"></h3>
            <p id="finalResultMessage" class="text-lg mb-6 text-white"></p>
            <button onclick="closeResultModal()" class="w-full px-6 py-3 bg-primary text-black rounded-lg shadow-md hover:opacity-80 font-semibold transition-colors duration-200">
                ปิด (สแกนคนต่อไป)
            </button>
        </div>
    </div>
    <audio id="beepSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
    <audio id="errorSound" src="https://assets.mixkit.co/active_storage/sfx/950/950-preview.mp3"></audio>

    <!-- ========================================== -->
    <!-- สคริปต์เชื่อมโยง API ไปยัง Google Apps Script  -->
    <!-- ========================================== -->
    <script>
        // 🚨 ขั้นตอนที่ 1: วาง URL ที่ได้จากการ Deploy Code.gs ตรงนี้ 🚨
        const API_URL = "https://script.google.com/macros/s/AKfycbyKT-bhSUz4sRteqviwC3Cyd15iClot5OGkV_BhAII_35AvwCOLhMMhk7_53Q8p3KJ0/exec"; // <-- แก้ไข URL ตรงนี้

        // ดึงค่าโหมดประตูมาจาก URL Parameters (เช่น ?mode=Gate A)
        const urlParams = new URLSearchParams(window.location.search);
        const scanMode = urlParams.get('mode') || 'Gate A'; // ค่าเริ่มต้นคือ Gate A

        // Proxy เชื่อมต่อ API อัตโนมัติ (ไม่ต้องแก้โค้ด google.script.run เดิม)
        function createGASProxy() {
            let _success = null;
            let _failure = null;
            const proxy = new Proxy({}, {
                get: function(target, prop) {
                    if (prop === 'withSuccessHandler') return function(cb) { _success = cb; return proxy; };
                    if (prop === 'withFailureHandler') return function(cb) { _failure = cb; return proxy; };
                    return function(...args) {
                        fetch(API_URL, {
                            redirect: "follow",
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ action: prop, args: args })
                        })
                        .then(res => res.json())
                        .then(data => { if (_success) _success(data); })
                        .catch(err => { if (_failure) _failure(err); });
                    };
                }
            });
            return proxy;
        }
        const google = { script: { get run() { return createGASProxy(); } } };

        // =========================================================
        // สคริปต์การทำงานเดิมทั้งหมดอยู่ด้านล่างนี้
        // =========================================================

        let html5QrCode, escortQrCode, currentCameraId, cameraList = [], isScanning = false, isEscortScanning = false, currentScanData = null, currentEscortData = {}, scanTimeout, wasMainScannerActive = false;

        function showMessage(type, message) {
            const msgDiv = document.getElementById('message');
            msgDiv.classList.remove('hidden', 'bg-green-800', 'bg-red-800', 'bg-blue-800', 'bg-yellow-800');
            let bgClass = type === 'success' ? 'bg-green-800' : type === 'error' ? 'bg-red-800' : type === 'warning' ? 'bg-yellow-800' : 'bg-blue-800';
            msgDiv.classList.add(bgClass); msgDiv.textContent = message;
        }

        function hideMessage() { document.getElementById('message').classList.add('hidden'); }
        function showModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function hideModal(id) { document.getElementById(id).classList.add('hidden'); }
        function playSound(type) { const audio = document.getElementById(type === 'error' ? 'errorSound' : 'beepSound'); if(audio) { audio.currentTime = 0; audio.play().catch(e=>console.log(e)); } }

        function initializeScanner() {
            document.getElementById('pageTitle').textContent = `ระบบสแกนเข้า-ออกพื้นที่ (${scanMode})`;
            document.getElementById('modeTitle').textContent = `จุดสแกน: ${scanMode}`;
            showMessage('info', 'ระบบพร้อมใช้งาน กรุณายิงบาร์โค้ด หรือคลิก "เปิดกล้องสแกน"');
            setTimeout(() => document.getElementById('barcodeInput').focus(), 500);
        }
        
        function startScanning() {
            if (isScanning) return;
            if (!currentCameraId) {
                if (!Html5Qrcode) return showMessage('error', 'Html5Qrcode not loaded.');
                Html5Qrcode.getCameras().then(devices => {
                    if (devices && devices.length) {
                        cameraList = devices;
                        const backCam = devices.find(d => d.label.toLowerCase().includes('back'));
                        currentCameraId = backCam ? backCam.id : devices[0].id;
                        executeMainScan();
                    } else showMessage('error', 'ไม่พบอุปกรณ์กล้อง');
                }).catch(err => showMessage('error', 'เข้าถึงกล้องไม่ได้: ' + err.message));
            } else executeMainScan();
        }

        function executeMainScan() {
            document.getElementById('reader-container').classList.remove('hidden');
            document.getElementById('reader').classList.remove('hidden');
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            if (escortQrCode && isEscortScanning) escortQrCode.stop().then(() => isEscortScanning = false).catch(()=>{});
            if (isScanning) return;

            html5QrCode.start(currentCameraId, { fps: 10, qrbox: {width: 350, height: 350}, formats: [Html5QrcodeSupportedFormats.QR_CODE, Html5QrcodeSupportedFormats.CODE_128] }, onScanSuccess, () => {})
            .then(() => {
                isScanning = true; wasMainScannerActive = true;
                document.getElementById('startScanBtn').classList.add('hidden');
                document.getElementById('stopScanBtn').classList.remove('hidden');
                document.getElementById('toggleCameraBtn').classList.remove('hidden');
                showMessage('info', 'กล้องกำลังทำงาน... หันกล้องไปที่รหัส หรือใช้เครื่องยิงบาร์โค้ดได้');
                setTimeout(() => document.getElementById('barcodeInput').focus(), 500);
            }).catch(err => {
                isScanning = false; wasMainScannerActive = false; showMessage('error', 'ผิดพลาด: ' + err.message);
                document.getElementById('startScanBtn').classList.remove('hidden'); document.getElementById('stopScanBtn').classList.add('hidden');
            });
        }

        function stopScanning() {
            if (!html5QrCode) return Promise.resolve();
            return html5QrCode.stop().then(() => {
                isScanning = false; wasMainScannerActive = false;
                document.getElementById('reader').classList.add('hidden');
                document.getElementById('startScanBtn').classList.remove('hidden');
                document.getElementById('stopScanBtn').classList.add('hidden');
                document.getElementById('toggleCameraBtn').classList.add('hidden');
                showMessage('info', 'ปิดกล้องแล้ว สามารถใช้เครื่องยิงบาร์โค้ดได้');
                setTimeout(() => document.getElementById('barcodeInput').focus(), 500);
            }).catch(e => console.error(e));
        }
        
        function toggleCamera() {
            if (cameraList.length <= 1) return showMessage('warning', 'มีกล้องเพียงตัวเดียว');
            if (!html5QrCode) return;
            html5QrCode.stop().then(() => {
                isScanning = false;
                currentCameraId = cameraList[(cameraList.findIndex(d => d.id === currentCameraId) + 1) % cameraList.length].id;
                showMessage('info', `สลับกล้องแล้ว`);
                setTimeout(executeMainScan, 500); 
            }).catch(e => console.error(e));
        }

        function handleBarcodeInput(event) { if (event.key === 'Enter') submitBarcode(); }
        function submitBarcode() { const code = document.getElementById('barcodeInput').value.trim(); if (code.length > 0) processCode(code); }
        function onScanSuccess(decodedText) { if (isScanning) processCode(decodedText); }

        function processCode(decodedText) {
            if (currentScanData !== null || !document.getElementById('resultModal').classList.contains('hidden') || !document.getElementById('finalResultModal').classList.contains('hidden')) return;
            wasMainScannerActive = isScanning; 

            if (decodedText && decodedText.length > 0) {
                showMessage('info', `กำลังตรวจสอบรหัส: ${decodedText}...`);
                playSound('beep');
                if(scanTimeout) clearTimeout(scanTimeout);
                scanTimeout = setTimeout(() => onScanFailure(new Error("หมดเวลาเชื่อมต่อ (Timeout)")), 30000);

                google.script.run
                    .withSuccessHandler(r => { clearTimeout(scanTimeout); onUserScanSuccess(r); })
                    .withFailureHandler(e => { clearTimeout(scanTimeout); onScanFailure(e); })
                    .getUserForScan(decodedText.trim().toUpperCase()); 
            } else {
                showMessage('error', 'รหัสไม่ถูกต้อง');
                resumeScanningIfActive(); 
            }
        }

        function resumeScanningIfActive() {
            if(document.getElementById('barcodeInput')) document.getElementById('barcodeInput').value = '';
            if(document.getElementById('escortBarcodeInput')) document.getElementById('escortBarcodeInput').value = '';

            if (wasMainScannerActive) {
                if (!isScanning) setTimeout(executeMainScan, 300);
                else { showMessage('info', 'กล้องพร้อมสแกนคนต่อไป...'); setTimeout(() => document.getElementById('barcodeInput').focus(), 300); }
            } else {
                showMessage('info', 'ระบบพร้อมใช้งาน ยิงบาร์โค้ดได้เลย');
                setTimeout(() => document.getElementById('barcodeInput').focus(), 300);
            }
        }
        
        function onUserScanSuccess(result) {
            hideMessage();
            if (!result.success) { showMessage('error', result.message); playSound('error'); setTimeout(resumeScanningIfActive, 3000); return; }

            currentScanData = result;
            currentEscortData = result.escortDataForCheckout || {}; 
            const isCheckIn = result.newStatus === 'เข้า', requiresEscort = result.requiresEscort;
            const sColor = isCheckIn ? 'text-primary' : 'text-warning', sBorder = isCheckIn ? 'border-primary' : 'border-warning', sBg = isCheckIn ? 'bg-primary' : 'bg-warning', sHover = isCheckIn ? 'hover:bg-green-600' : 'hover:bg-yellow-600'; 
            
            document.getElementById('modalStatusTitle').textContent = `ยืนยันการ${result.newStatus}พื้นที่`;
            document.getElementById('modalStatusTitle').className = `text-2xl font-bold mb-1 ${sColor}`;
            document.getElementById('modalProfileImg').src = result.data.profileUrl || 'https://placehold.co/150x150/333/fff?text=No+Img';
            document.getElementById('modalProfileImg').className = `w-32 h-32 rounded-full object-cover border-4 mx-auto my-3 ${sBorder}`;
            
            document.getElementById('modalFullName').textContent = result.data.fullName;
            document.getElementById('modalRegId').textContent = `รหัส: ${result.data.regId}`;
            document.getElementById('modalDepartment').textContent = `หน่วยงาน: ${result.data.department || 'ไม่ระบุ'}`;
            document.getElementById('modalPosition').textContent = `ตำแหน่ง: ${result.data.position || 'ไม่ระบุ'}`;
            document.getElementById('modalAviationArea').textContent = result.data.aviationAreas || 'N/A';
            document.getElementById('modalAreaContainer').className = `mt-3 p-2 mx-auto inline-block border-2 rounded-lg bg-dark-bg ${sBorder}`;
            document.getElementById('modalAviationArea').className = `text-2xl font-extrabold ${sColor}`;
            
            document.getElementById('modalCardType').textContent = `ประเภทบัตร: ${result.data.cardType}`;
            document.getElementById('modalCardType').className = `text-lg font-medium mt-2 ${sColor}`;
            document.getElementById('modalExpiry').textContent = `วันหมดอายุ: ${result.data.expiryDate}`;
            document.getElementById('modalMessage').innerHTML = `สถานะ: ${result.currentStatus} ➝ <b>${result.newStatus}</b>`;
            
            document.getElementById('confirmButton').className = `flex-1 px-4 py-3 text-white rounded-lg shadow-md font-semibold ${sBg} ${sHover}`;
            document.getElementById('checkRadio').checked = false; document.getElementById('checkMobile').checked = false; document.getElementById('checkEquipment').checked = false;
            document.getElementById('objectiveSelect').value = result.data.cardType.startsWith('เยี่ยมชม') ? "เยี่ยมชม" : "ปฏิบัติงาน";

            document.getElementById('entryDetailsSection').classList.remove('hidden'); 
            if (isCheckIn) {
                document.getElementById('entryDetailsTitle').textContent = 'ระบุอุปกรณ์และวัตถุประสงค์';
                document.getElementById('entryDetailsSection').classList.replace('bg-blue-800', 'bg-gray-700'); 
                document.getElementById('objectiveSelect').disabled = false;
                document.getElementById('objectiveSelect').classList.remove('opacity-50', 'cursor-not-allowed');
            } else { 
                document.getElementById('entryDetailsTitle').textContent = 'ยืนยันข้อมูลขาเข้า';
                document.getElementById('entryDetailsSection').classList.replace('bg-gray-700', 'bg-blue-800'); 
                if (result.latestEquipmentData) {
                    document.getElementById('checkRadio').checked = result.latestEquipmentData.radio;
                    document.getElementById('checkMobile').checked = result.latestEquipmentData.mobile;
                    document.getElementById('checkEquipment').checked = result.latestEquipmentData.equipment;
                    if (result.latestEquipmentData.objective) document.getElementById('objectiveSelect').value = result.latestEquipmentData.objective;
                }
                document.getElementById('objectiveSelect').disabled = true;
                document.getElementById('objectiveSelect').classList.add('opacity-50', 'cursor-not-allowed');
            }

            document.getElementById('escortSection').classList.add('hidden');
            document.getElementById('escortSection').classList.replace('bg-blue-800', 'bg-red-800');
            document.getElementById('escortSection').classList.replace('border-blue-500', 'border-red-500');
            document.getElementById('cancelButton').className = 'flex-1 px-4 py-3 bg-red-600 text-white rounded-lg shadow-md hover:bg-red-700 font-semibold';

            if (isCheckIn && requiresEscort) {
                document.getElementById('escortScanButton').classList.remove('hidden');
                document.getElementById('confirmButton').classList.add('hidden');
                document.getElementById('escortSection').classList.remove('hidden');
                setTimeout(() => document.getElementById('escortBarcodeInput').focus(), 500);
            } else {
                document.getElementById('escortScanButton').classList.add('hidden');
                document.getElementById('confirmButton').classList.remove('hidden');
                 if (result.newStatus === 'ออก' && !requiresEscort && result.escortDataForCheckout.escortName) {
                    document.getElementById('escortSection').classList.remove('hidden');
                    document.getElementById('escortStatus').innerHTML = `<p class="text-white font-semibold">ผู้รับรองตอนเข้า: ${result.escortDataForCheckout.escortName}</p>`;
                    document.getElementById('escortSection').classList.replace('bg-red-800', 'bg-blue-800'); 
                    document.getElementById('escortSection').classList.replace('border-red-500', 'border-blue-500');
                }
            }
            showModal('resultModal');
        }

        function handleEscortBarcodeInput(event) { if (event.key === 'Enter') submitEscortBarcode(); }
        function submitEscortBarcode() {
            const code = document.getElementById('escortBarcodeInput').value.trim();
            if (code.length > 0) {
                if (isEscortScanning && escortQrCode) escortQrCode.stop().then(() => isEscortScanning = false).catch(()=>{});
                document.getElementById('escortStatus').textContent = 'ตรวจสอบคนรับรอง...';
                google.script.run.withSuccessHandler(onEscortCheckSuccess).withFailureHandler(onEscortCheckFailure).checkEscort(code.toUpperCase());
                document.getElementById('escortBarcodeInput').value = '';
            }
        }

        function startEscortScan() {
            if (isEscortScanning) return;
            if (isScanning && html5QrCode) html5QrCode.stop().then(() => { isScanning = false; initEscortCamera(); }).catch(e => initEscortCamera());
            else initEscortCamera();
        }

        function initEscortCamera() {
            const startE = () => {
                document.getElementById('escortScanButton').classList.add('hidden');
                document.getElementById('escortStatus').textContent = 'รอสแกนคนรับรอง...';
                document.getElementById('escort-reader-container').innerHTML = '<div id="escort-reader"></div>'; 
                isEscortScanning = true;
                escortQrCode = new Html5Qrcode("escort-reader");
                escortQrCode.start(currentCameraId, { fps: 10, qrbox: {width: 300, height: 300}, formats: [Html5QrcodeSupportedFormats.QR_CODE, Html5QrcodeSupportedFormats.CODE_128] }, onEscortScanSuccess, () => {})
                .catch(err => { document.getElementById('escortStatus').textContent = 'เปิดกล้องไม่ได้: '+err.message; isEscortScanning = false; document.getElementById('escortScanButton').classList.remove('hidden'); });
                setTimeout(() => document.getElementById('escortBarcodeInput').focus(), 100);
            };
            if (!currentCameraId) Html5Qrcode.getCameras().then(devices => { if (devices.length) { cameraList = devices; const bc = devices.find(d => d.label.toLowerCase().includes('back')); currentCameraId = bc ? bc.id : devices[0].id; startE(); } }).catch(err => document.getElementById('escortStatus').textContent = 'เข้าถึงกล้องไม่ได้');
            else startE();
        }

        function onEscortScanSuccess(text) {
            if (!isEscortScanning || !escortQrCode) return;
            escortQrCode.stop().then(() => {
                isEscortScanning = false; document.getElementById('escortStatus').textContent = 'ตรวจสอบคนรับรอง...'; playSound('beep');
                google.script.run.withSuccessHandler(onEscortCheckSuccess).withFailureHandler(onEscortCheckFailure).checkEscort(text.trim().toUpperCase()); 
            }).catch(err => isEscortScanning = false);
        }

        function onEscortCheckSuccess(result) {
            document.getElementById('escort-reader-container').innerHTML = '<div id="escort-reader"></div>'; 
            if (result.success) {
                currentEscortData = result.escortData; 
                document.getElementById('escortStatus').innerHTML = `
                    <div class="bg-green-900 bg-opacity-60 p-3 rounded border border-green-500 flex gap-3 text-left">
                        <img src="${result.escortData.profileUrl || ''}" onerror="this.src='https://placehold.co/100'" class="w-16 h-16 rounded-full border-2 border-green-400 object-cover">
                        <div>
                            <p class="text-green-400 font-bold">✅ รับรองได้</p><p class="text-white">${result.escortData.escortName}</p>
                            <p class="text-yellow-400">โควตา: ${result.escortData.escortCount}/${result.escortData.quotaMax} ➝ ${result.escortData.escortCount+1}/${result.escortData.quotaMax}</p>
                        </div>
                    </div>`;
                document.getElementById('confirmButton').classList.remove('hidden');
                document.getElementById('escortScanButton').classList.add('hidden');
                document.getElementById('cancelButton').className = 'w-1/2 px-4 py-3 bg-red-600 text-white rounded-lg font-semibold';
            } else {
                playSound('error');
                document.getElementById('escortStatus').innerHTML = `<div class="bg-red-900 bg-opacity-40 p-3 rounded border border-red-500"><p class="text-red-400 font-bold">⛔ ${result.message}</p></div>`;
                document.getElementById('escortScanButton').classList.remove('hidden'); document.getElementById('escortScanButton').innerText = "สแกนคนรับรองใหม่"; 
            }
        }
        
        function onEscortCheckFailure(error) { playSound('error'); document.getElementById('escort-reader-container').innerHTML = ''; document.getElementById('escortStatus').textContent = 'ตรวจสอบผิดพลาด: '+error.message; document.getElementById('escortScanButton').classList.remove('hidden'); }

        function confirmTransaction() {
            if (!currentScanData) return;
            if (currentScanData.requiresEscort && !currentEscortData.escortRegId) return alert("กรุณาสแกนคนรับรองก่อน");
            showModal('loadingModal'); hideModal('resultModal');
            if(scanTimeout) clearTimeout(scanTimeout);
            scanTimeout = setTimeout(() => onRecordFailure(new Error("หมดเวลาเชื่อมต่อ")), 30000);

            google.script.run
                .withSuccessHandler(r => { clearTimeout(scanTimeout); onRecordSuccess(r); })
                .withFailureHandler(e => { clearTimeout(scanTimeout); onRecordFailure(e); })
                .recordAccess(currentScanData.data.regId, currentScanData.newStatus, scanMode, document.getElementById('checkRadio').checked, document.getElementById('checkMobile').checked, document.getElementById('checkEquipment').checked, document.getElementById('objectiveSelect').value, currentEscortData);
        }

        function cancelTransaction() {
            hideModal('resultModal');
            if (isEscortScanning && escortQrCode) escortQrCode.stop().then(() => isEscortScanning = false).catch(()=>{});
            currentScanData = null; currentEscortData = {}; showMessage('warning', 'ยกเลิกการบันทึกแล้ว เริ่มสแกนใหม่...'); resumeScanningIfActive();
        }

        function closeResultModal() {
            hideModal('finalResultModal'); hideModal('resultModal');
            if (isEscortScanning && escortQrCode) escortQrCode.stop().then(() => isEscortScanning = false).catch(()=>{});
            currentScanData = null; currentEscortData = {}; resumeScanningIfActive();
        }

        function onRecordSuccess(result) {
            hideModal('loadingModal'); playSound('beep');
            document.getElementById('finalResultIcon').innerHTML = `<svg class="w-16 h-16 text-primary mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2m4-4l-4 4m0 0l-4-4m4 4V7"></path></svg>`;
            const finalImg = document.getElementById('finalResultImg');
            if (currentScanData && currentScanData.data.profileUrl) { finalImg.src = currentScanData.data.profileUrl; finalImg.className = 'w-24 h-24 rounded-full object-cover border-4 border-primary mx-auto mb-4'; } else finalImg.classList.add('hidden');
            document.getElementById('finalResultTitle').textContent = 'บันทึกเรียบร้อย'; document.getElementById('finalResultTitle').className = 'text-3xl font-bold mb-2 text-primary';
            document.getElementById('finalResultMessage').textContent = `${result.fullName} บันทึกการ${result.newStatus}สำเร็จ!`;
            document.querySelector('#finalResultModal button').className = 'w-full px-6 py-3 bg-primary text-black rounded-lg shadow-md font-semibold';
            showModal('finalResultModal');
        }

        function onRecordFailure(error) {
            hideModal('loadingModal'); playSound('error');
            document.getElementById('finalResultIcon').innerHTML = `<svg class="w-16 h-16 text-error mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            document.getElementById('finalResultImg').classList.add('hidden');
            document.getElementById('finalResultTitle').textContent = 'ระบบผิดพลาด'; document.getElementById('finalResultTitle').className = 'text-3xl font-bold mb-2 text-error';
            document.getElementById('finalResultMessage').textContent = `การบันทึกไม่สำเร็จ: ${error.message}`;
            document.querySelector('#finalResultModal button').className = 'w-full px-6 py-3 bg-red-600 text-white rounded-lg shadow-md font-semibold';
            showModal('finalResultModal');
        }

        window.onload = function() {
            initializeScanner();
            document.addEventListener('click', (e) => {
                if (!document.getElementById('resultModal').classList.contains('hidden') && !document.getElementById('escortSection').classList.contains('hidden')) {
                     const escortInput = document.getElementById('escortBarcodeInput');
                     if (escortInput && !['BUTTON', 'INPUT'].includes(e.target.tagName) && !e.target.closest('button')) escortInput.focus();
                     return;
                }
                if(!document.getElementById('resultModal').classList.contains('hidden') || !document.getElementById('finalResultModal').classList.contains('hidden')) return;
                const input = document.getElementById('barcodeInput');
                if (input && !['BUTTON', 'INPUT'].includes(e.target.tagName) && !e.target.closest('button') && !e.target.closest('.modal')) input.focus();
            });
        };
    </script>
</body>
</html>
